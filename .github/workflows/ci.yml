name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint
        run: |
          cd backend
          python -c "import ast; import pathlib; [ast.parse(f.read_text()) for f in pathlib.Path('app').rglob('*.py')]"
      - name: Import check
        run: |
          cd backend
          python -c "from app.main import app; print(f'Routes: {len([r for r in app.routes if hasattr(r, chr(112)+chr(97)+chr(116)+chr(104))])}'); print('OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit --skipLibCheck || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend/
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod frontend/
