services:
  - type: web
    name: skillyn-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        value: https://resu-match-one.vercel.app
      - key: CORS_ORIGINS
        value: https://resu-match-one.vercel.app
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ENV
        value: production
      - key: SENTRY_DSN
        sync: false

databases:
  - name: skillyn-db
    plan: starter
    region: oregon
