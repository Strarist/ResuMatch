services:
  - type: web
    name: resumatch-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://resu-match-one.vercel.app
      - key: CORS_ORIGINS
        value: '["https://resu-match-one.vercel.app"]'
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ENV
        value: production
      - key: SENTRY_DSN
        sync: false

databases:
  - name: resumatch-db
    plan: starter
    region: oregon
